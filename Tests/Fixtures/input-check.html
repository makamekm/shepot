<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка ввода Шёпота</title><style>body{font:18px system-ui;max-width:780px;margin:50px auto;background:#f5f3fa;color:#222}section{background:white;padding:24px;border-radius:16px;margin:20px 0}textarea,[contenteditable]{display:block;box-sizing:border-box;width:100%;min-height:140px;border:2px solid #7861bd;border-radius:10px;padding:15px;font:20px system-ui;white-space:pre-wrap}output{display:block;margin-top:16px;font:14px system-ui;color:#486c52}p{font-size:15px;color:#666}</style><h1>Проверка ввода Шёпота</h1><p>Локальная проверка. Сеть и отправка сообщений не используются.</p><section><h2>Обычное поле</h2><textarea aria-label="Обычное поле" id="plain"></textarea><output id="plain-state">Событий ввода: 0</output></section><section><h2>Поле как в чате</h2><div role="textbox" aria-label="Поле как в чате" aria-multiline="true" contenteditable="true" id="chat"></div><output id="chat-state">Событий ввода: 0</output></section><script>for(const id of ['plain','chat']){const el=document.getElementById(id);let state='',count=0;const read=()=>id==='plain'?el.value:el.innerText;const render=v=>{if(id==='plain')el.value=v;else el.innerText=v};el.addEventListener('input',e=>{state=read();count++;document.getElementById(id+'-state').textContent='Событий ввода: '+count+' · Нативное событие: '+e.isTrusted+' · Сохранённый текст: '+state});setInterval(()=>{if(read()!==state)render(state)},250)}</script></html>
